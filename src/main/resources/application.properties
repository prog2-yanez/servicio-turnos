spring.application.name=servicio-turnos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=${SERVER_PORT:8081}
catedra.api.url=${CATEDRA_API_URL:}
catedra.api.timeout-conexion=5s
catedra.api.timeout-lectura=30s
catedra.jwt=${CATEDRA_JWT:}
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group=${CATEDRA_KAFKA_CONSUMER_GROUP:}
catedra.kafka.topic-acciones=${CATEDRA_KAFKA_TOPIC_ACCIONES:}
catedra.kafka.topic-telefono=${CATEDRA_KAFKA_TOPIC_TELEFONO:}
catalogo.api.url=${CATALOGO_API_URL:http://localhost:8080}
